workflows:
  android-workflow:
    name: Contolonerxs Android Build
    max_build_duration: 30
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Generate Android platform files (jika belum ada)
        script: |
          if [ ! -d "android" ]; then
            # --org dipakai biar nama package aplikasi bukan default
            # com.example lagi, jadi com.arvirmdn.contolonerxs
            flutter create --platforms=android --org com.arvirmdn .
            echo "NEW_ANDROID=true" >> $CM_ENV
          fi
      - name: Tambah izin INTERNET (buat fitur Musik manggil API)
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i.bak 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\
            <uses-permission android:name="android.permission.INTERNET"/>#' "$MANIFEST"
            rm -f "$MANIFEST.bak"
          fi
      - name: Setup notifikasi media (just_audio_background) di AndroidManifest
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Izin buat notifikasi/foreground service player musik
          if ! grep -q "android.permission.WAKE_LOCK" "$MANIFEST"; then
            sed -i.bak 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\
            <uses-permission android:name="android.permission.WAKE_LOCK"/>\
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>#' "$MANIFEST"
            rm -f "$MANIFEST.bak"
          fi
          # Activity utama diganti ke AudioServiceActivity biar tombol
          # play/pause di notifikasi & lockscreen nyambung ke player
          if grep -q 'android:name=".MainActivity"' "$MANIFEST"; then
            sed -i.bak 's#android:name=".MainActivity"#android:name="com.ryanheise.audioservice.AudioServiceActivity"#' "$MANIFEST"
            rm -f "$MANIFEST.bak"
          fi
          # Service + receiver yang nampilin & ngontrol notifikasi media
          if ! grep -q "com.ryanheise.audioservice.AudioService" "$MANIFEST"; then
            sed -i.bak 's#</application>#    <service android:name="com.ryanheise.audioservice.AudioService" android:foregroundServiceType="mediaPlayback" android:exported="true">\
                <intent-filter>\
                    <action android:name="android.media.browse.MediaBrowserService" />\
                </intent-filter>\
            </service>\
            <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true">\
                <intent-filter>\
                    <action android:name="android.intent.action.MEDIA_BUTTON" />\
                </intent-filter>\
            </receiver>\
        </application>#' "$MANIFEST"
            rm -f "$MANIFEST.bak"
          fi
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Generate app icon custom
        script: flutter pub run flutter_launcher_icons
      - name: Siapkan folder android/ buat didownload (sekali saja)
        script: |
          # Zip folder android/ supaya bisa didownload dari halaman build
          # ini SEKALI, lalu diupload manual ke repo GitHub kalau mau setup
          # signing release (lihat README bagian "Setup signing release").
          if [ "$NEW_ANDROID" = "true" ]; then
            zip -r android-folder.zip android
          fi
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
      - android-folder.zip
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
