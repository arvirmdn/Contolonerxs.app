name: contolonerxs
description: "Contolonerxs app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  http: ^1.2.2
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.18
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# Konfigurasi app icon custom (dipakai oleh flutter_launcher_icons,
# dijalankan otomatis di codemagic.yaml tiap build)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
